<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>KZM · Odyssey AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html { background: #000; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
    body { background: transparent; }
    .ui { position: fixed; z-index: 10; }
    #brand { top: 16px; left: 16px; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
    #brand b { display: block; font-size: 22px; letter-spacing: .08em; font-family: Georgia, 'Times New Roman', serif; }
    #brand span { font-size: 11px; letter-spacing: .16em; color: #e0a526; text-transform: uppercase; }
    #hint {
      left: 50%; bottom: 88px; transform: translateX(-50%);
      padding: 10px 18px; border-radius: 999px; background: rgba(0,0,0,.6);
      color: #fff; font-size: 15px; transition: opacity .4s; pointer-events: none; white-space: nowrap;
    }
    #hint.hidden { opacity: 0; }
    #loading { top: 50%; left: 50%; transform: translate(-50%,-50%); color: #fff; font-size: 14px; letter-spacing: .1em; }
    #work {
      left: 50%; bottom: 28px; transform: translateX(-50%);
      padding: 12px 22px; border-radius: 999px; background: #d99a22; color: #1a1a1a;
      font-size: 14px; font-weight: 600; letter-spacing: .06em; text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="brand" class="ui"><b>ODYSSEY</b><span>KZM · Water coaster concept</span></div>
  <div id="hint" class="ui">Apunta la cámara al ticket</div>
  <a id="work" class="ui" href="https://kzmdesigns.com">kzmdesigns.com</a>

  <!-- targets.mind: 0 = reverso (Odyssey + QR AR), 1 = frente (nombre + QR Work) -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; uiScanning: no; uiLoading: yes; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 12; warmupTolerance: 3"
    gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/"
    color-space="sRGB"
    renderer="colorManagement: true; antialias: false; maxCanvasWidth: 1280; maxCanvasHeight: 1280; precision: mediump"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="60000">
      <a-asset-item id="odyssey" src="./odyssey.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-light type="hemisphere" color="#ffffff" ground-color="#8a8070" intensity="1.1"></a-light>
    <a-light type="directional" intensity="1.0" position="0.5 1 1.5"></a-light>

    <a-entity class="card" mindar-image-target="targetIndex: 0"></a-entity>
    <a-entity class="card" mindar-image-target="targetIndex: 1"></a-entity>
    <!-- El diorama no vive dentro del ticket: lo sigue con suavizado para que no tiemble -->
    <a-entity id="follower" smooth-follow="targets: .card"></a-entity>
  </a-scene>

  <script>
    // ===== AJUSTES =====
    // SCALE: tamaño del diorama (0.0052 = cabe justo en el ticket).
    // SMOOTH: suavizado del movimiento, de 0 a 1. Más bajo = más estable pero sigue más lento al ticket.
    // HOLD_MS: cuánto tiempo se queda el diorama si la cámara pierde el ticket un momento.
    const SCALE = 0.0052, SMOOTH = 0.12, HOLD_MS = 700;
    // JUMP_DEG / JUMP_DIST: un salto mayor que esto se ignora salvo que se repita CONFIRM frames seguidos.
    const JUMP_DEG = 25, JUMP_DIST = 0.35, CONFIRM = 5;

    AFRAME.registerComponent('smooth-follow', {
      schema: { targets: { type: 'string' } },
      init() {
        this.targets = [...document.querySelectorAll(this.data.targets)];
        this.p = new THREE.Vector3(); this.q = new THREE.Quaternion(); this.s = new THREE.Vector3();
        this.has = false; this.lastSeen = 0;
        this.el.object3D.visible = false;
      },
      tick(t, dt) {
        const o = this.el.object3D;
        const tg = this.targets.find(e => e.object3D.visible);
        if (tg) {
          tg.object3D.updateMatrixWorld(true);
          tg.object3D.matrixWorld.decompose(this.p, this.q, this.s);
          if (!this.has) { o.position.copy(this.p); o.quaternion.copy(this.q); o.scale.copy(this.s); this.has = true; this.bad = 0; }
          else {
            // Detecta saltos: angulo y distancia (relativa al ancho del ticket) contra la pose actual
            const ang = THREE.MathUtils.radToDeg(o.quaternion.angleTo(this.q));
            const dist = o.position.distanceTo(this.p) / Math.max(1e-6, o.scale.x);
            if (ang > JUMP_DEG || dist > JUMP_DIST) {
              this.bad++;
              if (this.bad < CONFIRM) { this.lastSeen = t; return; }   // frame dudoso: lo ignoramos
              o.position.copy(this.p); o.quaternion.copy(this.q); o.scale.copy(this.s); // el cambio es real
            } else {
              const k = 1 - Math.pow(1 - SMOOTH, (dt || 16.7) / 16.7);
              o.position.lerp(this.p, k); o.quaternion.slerp(this.q, k); o.scale.lerp(this.s, k);
            }
            this.bad = 0;
          }
          o.visible = true; this.lastSeen = t;
        } else if (this.has && t - this.lastSeen > HOLD_MS) {
          o.visible = false; this.has = false;
        }
      }
    });

    document.getElementById('follower').innerHTML = `
      <a-entity rotation="90 0 0">
        <a-entity rotation="0 90 0" scale="${SCALE} ${SCALE} ${SCALE}">
          <a-entity gltf-model="#odyssey" position="-832.5 7.5 1774"
            animation-mixer="clip: *; loop: repeat; timeScale: 1"></a-entity>
        </a-entity>
      </a-entity>`;

    const hint = document.getElementById('hint');
    let visible = 0;
    document.querySelectorAll('.card').forEach(t => {
      t.addEventListener('targetFound', () => { visible++; hint.classList.add('hidden'); window.FOUND = true; });
      t.addEventListener('targetLost', () => { visible = Math.max(0, visible - 1); if (!visible) hint.classList.remove('hidden'); });
    });
    // Limita la resolucion en pantallas muy densas para ganar fluidez
    document.querySelector('a-scene').addEventListener('loaded', e => {
      const r = e.target.renderer; if (r) r.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    });
  </script>
</body>
</html>
